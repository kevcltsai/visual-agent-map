name: CI

permissions:
  contents: write

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Refresh generated artifacts on architecture refactor branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/product-shell-experiences'
        run: |
          if ! git diff --quiet -- main.js samples/taiwan-travel/compiled.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add main.js samples/taiwan-travel/compiled.json
            git commit -m "build: refresh generated artifacts"
            git push
          fi
      - name: Verify generated artifacts are committed
        run: git diff --exit-code -- main.js samples/taiwan-travel/compiled.json
      - run: npm run check:artifacts
