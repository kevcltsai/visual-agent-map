name: CI

# The run name tells find-green-ci-run.sh which runs are full. A full run is a push to main or a manual run with full=true;
# every other push (feature branches, pull requests) runs only the tests a change can reach (scripts/test-affected.mjs).
run-name: "CI ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.full)) && 'full' || 'affected' }}: ${{ github.event.head_commit.message || github.event.pull_request.title || github.ref_name }}"

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full test suite and refresh the dependency table cache"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# A newer push to the same ref cancels the older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: verify (${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.full)) && 'full' || 'affected' }})
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      MODE: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.full)) && 'full' || 'affected' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # On main, reuse a green FULL ci.yml run for the same head_sha (any branch). Any query failure leaves `run` empty, so verify runs.
      - id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if id=$(sh scripts/find-green-ci-run.sh "$GITHUB_SHA"); then
            echo "verify skipped: reusing green full ci.yml run $id for $GITHUB_SHA"
            echo "run=$id" >> "$GITHUB_OUTPUT"
          else
            echo "no reusable green full run for $GITHUB_SHA; running verify"
          fi
      # Reusing a full run skips verify, so the table it made is carried over: downloaded from that run and cached for main. A failure here only leaves the table older (test-affected still selects soundly from an older table).
      - if: steps.reuse.outputs.run != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "${{ steps.reuse.outputs.run }}" -n test-deps -D "$RUNNER_TEMP/test-deps-download"
          cp "$RUNNER_TEMP/test-deps-download/test-deps.json" test-deps.json
      - if: steps.reuse.outputs.run != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: test-deps.json
          key: test-deps-${{ github.sha }}
      - uses: actions/setup-node@v5
        if: steps.reuse.outputs.run == ''
        with:
          node-version: 22
          cache: npm
      - if: steps.reuse.outputs.run == ''
        run: npm ci
      # Affected runs read the dependency table of the latest full run (cache key test-deps-<sha>); a miss makes test:affected run everything.
      - if: steps.reuse.outputs.run == '' && env.MODE == 'affected'
        uses: actions/cache/restore@v4
        with:
          path: test-deps.json
          key: test-deps-none-${{ github.sha }}
          restore-keys: test-deps-
      - if: steps.reuse.outputs.run == '' && env.MODE == 'affected'
        run: |
          npm run lint && npm run format:check && npm run check:i18n && npm run build && npm run test:affected \
            && git diff --exit-code -- main.js experiences/sharing/viewer-bundle.generated.ts && npm run check:artifacts
      - if: steps.reuse.outputs.run == '' && env.MODE == 'full'
        env:
          VAM_TEST_DEPS_DIR: ${{ runner.temp }}/test-deps-records
        run: npm run verify
      - if: steps.reuse.outputs.run == '' && env.MODE == 'full'
        run: node scripts/test-affected.mjs --write-deps "$RUNNER_TEMP/test-deps-records"
      - if: steps.reuse.outputs.run == '' && env.MODE == 'full'
        uses: actions/cache/save@v4
        with:
          path: test-deps.json
          key: test-deps-${{ github.sha }}
      - if: steps.reuse.outputs.run == '' && env.MODE == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: test-deps
          path: test-deps.json
          retention-days: 30
