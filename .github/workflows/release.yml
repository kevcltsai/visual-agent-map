name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify version
        run: test "$(node -p "require('./manifest.json').version")" = "$GITHUB_REF_NAME"

      - name: Lint
        run: npm run lint

      - name: Build the release distribution files
        env:
          VAM_RELEASE_BUILD: "1"
        run: npm run build

      - name: Test release notice and product behavior
        env:
          VAM_RELEASE_BUILD: "1"
        run: npm test

      - name: Verify release artifacts
        env:
          VAM_RELEASE_BUILD: "1"
        run: npm run check:artifacts

      - name: Prepare Corresponding Source archive and checksum
        run: npm run release:source -- "$GITHUB_REF_NAME"

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release (never overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite published assets." >&2
            exit 1
          else
            node scripts/changelog-section.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md" || { echo "CHANGELOG.md section for $GITHUB_REF_NAME is missing or empty; refusing to fall back to generated notes." >&2; exit 1; }
            gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css LICENSE NOTICE LICENSES/Apache-2.0.txt LICENSES/ASSET-ATTRIBUTIONS.md "release-dist/visual-agent-map-$GITHUB_REF_NAME-source.tar.gz" "release-dist/visual-agent-map-$GITHUB_REF_NAME-source.tar.gz.sha256" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
